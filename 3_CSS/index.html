<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <!-- 3 - Intear CSS -->
     <style>
        p{
            color:blue;
            font-size: 40px;

        }
     </style>

    <!-- 4 - External CSS -->
     <!-- Cascading style sheets -->
     <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- 1 - Inline CSS -->
     <h1 style="color: red;">Mudar cor com o Inline</h1>
     <h1 style="color: aquamarine;">Outro título</h1>

     <!-- 2 - Mútiplas regras -->
      <h1 style="color: blueviolet; font-size: 55px; border-bottom: 2px solid red;">
        Mudar cor e tamanho da fonte
    </h1>

    <!-- 3 - Intear CSS -->
     <p>Eu fui estilizado pelo internal</p>
     <p>Mais um</p>
     <p>E mais outro</p>

    <!-- 4 - External CSS  -->
    <h3>Meu título verde</h3>
    <h2>Segundo teste</h2>

    <!-- 5 - Ordem do CSS -->
     <p style="color: red;">Ordem do CSS</p>
     <p>Ordem do CSS</p>

</body>
</html>
