<!DOCTYPE html>
<html>
    <head>
        <title>HTML fundamentos</title>
    </head>
    <body style="padding-bottom: 500px">
        <!-- 1 - Titúlos -->
        <h1>Este é um título importante(h1)</h1>
        <h2>Outro exemplo(h2)</h2>
        <h3>Um novo título(h3)</h3>
        <h4>Outro título(h4)</h4>
        <h5>Novo título(h5)</h5>
        <h6>Último exemplo(h6)</h6>

        <!-- 2 -Parágrafos -->
        <p>Descrição dos nossos serviços</p>
        <p>Mais um parágrafo</p>

        <!-- 3 - Tags sem contúdo -->
        <p>Um parágrafo</p>
        <br>
        <p>Segundo parágrafo</p>
        <hr>
        <p>Terceiro parágrafo</p>

        <!-- 4 Comentários -->
        <!-- Este  é um comentário-->
        <h2>Mais um título</h2>
        <!-- Outro comentário -->

        <!-- 5 - Atributos -->
         <a href="https://google.com">Google</a>
         <br>

         <!-- 6 - Abrir link nova aba -->
        <a href="https://google.com" target="_blank">Google em nova aba</a>
        <br>

        <!-- 7 - Imagem -->
         <img src="img/city.jpg">
    </body>
</html>
